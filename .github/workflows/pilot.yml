name: Representative CPU pilot
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
      - name: Pilot across track and car categories
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/blender/blender --background --threads 4 --python cloud_worker.py -- --pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representative-pilot
          path: results/checkpoint.json
          retention-days: 1
