name: CPU benchmark
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
      - name: Measure CPU geometry pass
        run: /tmp/blender/blender --background --threads 4 --python benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-benchmark
          path: results/benchmark.json
          retention-days: 1
