name: MySim candidate wave
on:
  workflow_dispatch:
    inputs:
      groups:
        description: Non-overlapping job IDs
        required: true
        default: '["job-01"]'
      wave:
        required: true
        default: '0001'
permissions:
  contents: write
jobs:
  compute:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        group: ${{ fromJSON(inputs.groups) }}
    concurrency:
      group: mysim-${{ matrix.group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender CPU runtime
        run: |
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
      - name: Process assigned meshes and publish checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          WAVE: ${{ inputs.wave }}
        run: /tmp/blender/blender --background --threads 4 --python-exit-code 1 --python execute_job.py -- ${{ matrix.group }}
